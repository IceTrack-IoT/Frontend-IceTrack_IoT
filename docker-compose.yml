name: ice-track-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ice-track-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://spring-app:8080}
    ports:
      - "4200:80"
    networks:
      ice-track-net:
        aliases:
          - frontend

networks:
  ice-track-net:
    external: true
    name: ice-track-net
