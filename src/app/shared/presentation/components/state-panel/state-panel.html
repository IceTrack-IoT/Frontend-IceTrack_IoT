<div
  class="state-panel"
  [class.state-panel--error]="kind() === 'error'"
  [attr.role]="kind() === 'error' ? 'alert' : 'status'"
  [attr.aria-busy]="kind() === 'loading' || null"
>
  @if (icon(); as name) {
    <span class="state-panel__badge">
      <app-icon class="state-panel__icon" [name]="name" />
    </span>
  } @else {
    <span class="state-panel__spinner" aria-hidden="true"></span>
  }
  <p class="state-panel__heading">{{ heading() }}</p>
  @if (message(); as text) {
    <p class="state-panel__message">{{ text }}</p>
  }
  <div class="state-panel__actions">
    <ng-content />
  </div>
</div>
