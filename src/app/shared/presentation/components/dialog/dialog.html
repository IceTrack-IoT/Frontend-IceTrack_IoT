<dialog
  #dialog
  class="dialog"
  [attr.aria-labelledby]="headingId"
  [attr.aria-describedby]="description() ? descriptionId : null"
  (cancel)="requestClose($event)"
  (close)="requestClose()"
>
  <div class="dialog__header">
    <h2 class="dialog__title" [id]="headingId">{{ heading() }}</h2>
    <button
      class="ui-button ui-button--ghost ui-button--icon"
      type="button"
      [attr.aria-label]="'shared.actions.close' | translate"
      (click)="requestClose()"
    >
      <app-icon class="ui-button__icon" name="x" />
    </button>
  </div>

  <div class="dialog__body">
    @if (description(); as text) {
      <p class="dialog__description" [id]="descriptionId">{{ text }}</p>
    }
    <ng-content />
  </div>

  <div class="dialog__footer">
    <ng-content select="[dialogActions]" />
  </div>
</dialog>
